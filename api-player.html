<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/assets/favicon.png" type="image/x-icon">
    <title>M3U8 API Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://static.itsmarian.dev/fonts/font-awesome-v7.2.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #000; overflow: hidden; width: 100vw; height: 100vh; }
        .video-wrapper { position: relative; width: 100%; height: 100%; background: #000; cursor: none; }
        .video-wrapper:hover { cursor: default; } .video-wrapper.controls-hidden { cursor: none !important; } .controls-hidden .custom-controls { opacity: 0 !important; } .video-wrapper.default-controls .custom-controls { display: none !important; }
        #video { width: 100%; height: 100%; object-fit: contain; display: block; }
        .error-message { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); background: rgba(239,83,80,0.15); border: 1px solid rgba(239,83,80,0.4); color: #ef5350; padding: 10px 20px; border-radius: 8px; font-size: 13px; z-index: 30; display: none; white-space: nowrap; } .error-message.show { display: block; }
        .loading-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100px; height: 100px; opacity: 0; pointer-events: none; z-index: 15; transition: opacity 0.2s; } .loading-overlay.active { opacity: 1; }
        .video_sspinner { position: relative; width: 64px; height: 64px; } .video_sspinner-container { pointer-events: none; position: absolute; width: 100%; padding-bottom: 100%; top: 50%; left: 50%; margin-top: -50%; margin-left: -50%; animation: linspin 1568ms linear infinite; } .video_sspinner-rotator { position: absolute; width: 100%; height: 100%; animation: easespin 5332ms cubic-bezier(0.4,0,0.2,1) infinite both; } .video_sspinner-left, .video_sspinner-right { position: absolute; top: 0; bottom: 0; overflow: hidden; } .video_sspinner-left { right: 49%; } .video_sspinner-right { left: 49%; } .video_sspinner-circle { box-sizing: border-box; position: absolute; width: 200%; height: 100%; border-style: solid; border-color: #ddd #ddd transparent; border-radius: 50%; border-width: 6px; } .video_sspinner-left .video_sspinner-circle { left: 0; right: -100%; border-right-color: transparent; animation: left-spin 1333ms cubic-bezier(0.4,0,0.2,1) infinite both; } .video_sspinner-right .video_sspinner-circle { left: -100%; right: 0; border-left-color: transparent; animation: right-spin 1333ms cubic-bezier(0.4,0,0.2,1) infinite both; } @keyframes linspin { to { transform: rotate(360deg); } } @keyframes easespin { 12.5% { transform: rotate(135deg); } 25% { transform: rotate(270deg); } 37.5% { transform: rotate(405deg); } 50% { transform: rotate(540deg); } 62.5% { transform: rotate(675deg); } 75% { transform: rotate(810deg); } 87.5% { transform: rotate(945deg); } to  { transform: rotate(1080deg); } } @keyframes left-spin  { 0% { transform: rotate(130deg); } 50% { transform: rotate(-5deg); } to { transform: rotate(130deg); } } @keyframes right-spin { 0% { transform: rotate(-130deg); } 50% { transform: rotate(5deg); } to { transform: rotate(-130deg); } }
        .seek-feedback { position: absolute; display: flex; top: 50%; transform: translateY(-50%); color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 24px; font-weight: bold; z-index: 25; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; } .seek-feedback.show { opacity: 1; } .seek-feedback.forward { right: 20px; } .seek-feedback.backward { left: 20px; } .seek-feedback.volume-feedback { gap: 15px; align-items: center; left: 50%; transform: translate(-50%, -50%); } .seek-feedback.forward svg { order: 2; } .seek-feedback.forward .seek-text { order: 1; } .seek-text { align-items: center; display: flex; justify-content: center; margin-left: -20px; } .seek-text span { transform: translateY(-2px); } .seek-feedback .volume-text { transform: translateY(-2px); } .seek-feedback.volume-feedback svg { transform: translateX(10px); }
        .skparr2 { animation: skiparr2 0.5s forwards; } .skparr3 { animation: skiparr3 0.5s forwards; } @keyframes skiparr2 { to { transform: translate(-22.125px,0); } } @keyframes skiparr3 { to { transform: translate(-44.25px,0); } }
        .pip-feedback { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 8px; font-size: 14px; z-index: 30; opacity: 0; transition: opacity 0.3s; pointer-events: none; } .pip-feedback.show { opacity: 1; }
        .custom-controls { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.8) 60%, transparent 100%); padding: 40px 16px 12px; opacity: 0; transition: opacity 0.3s ease; z-index: 10; } .video-wrapper:hover .custom-controls { opacity: 1; }
        .progress-container { width: 100%; margin-bottom: 10px; cursor: pointer; padding: 6px 0; } .progress-bar-wrapper { position: relative; height: 4px; background: rgba(255,255,255,0.2); border-radius: 10px; overflow: visible; transition: height 0.2s; } .progress-container:hover .progress-bar-wrapper { height: 6px; } .progress-buffer { position: absolute; height: 100%; background: rgba(255,255,255,0.3); border-radius: 10px; width: 0%; transition: width 0.2s; } .progress-filled { position: absolute; height: 100%; background: linear-gradient(135deg, #1976d2 0%, #1565c0 100%); border-radius: 10px; width: 0%; transition: width 0.1s linear; } .progress-handle { position: absolute; right: -6px; top: 50%; transform: translateY(-50%) scale(0); width: 12px; height: 12px; background: #fff; border-radius: 50%; box-shadow: 0 2px 8px rgba(0,0,0,0.4); transition: transform 0.2s; } .progress-container:hover .progress-handle { transform: translateY(-50%) scale(1); }
        .controls-row { display: flex; align-items: center; gap: 10px; } .control-btn { background: none; border: none; color: #fff; font-size: 17px; cursor: pointer; padding: 7px; border-radius: 8px; transition: all 0.2s; display: flex; align-items: center; justify-content: center; min-width: 34px; height: 34px; position: relative; } .control-btn:hover { background: rgba(255,255,255,0.15); transform: scale(1.08); } .control-btn:hover .tooltip { opacity: 1; visibility: visible; transform: translate(-50%,0); } .control-btn.disabled { opacity: 0.4; cursor: not-allowed; }
        .play-pause-btn { font-size: 20px; min-width: 40px; height: 40px; background: rgba(102,126,234,0.2); }
        .tooltip { position: absolute; bottom: 100%; left: 50%; transform: translate(-50%, 10px); background: rgba(0,0,0,0.9); color: #fff; padding: 7px 11px; border-radius: 6px; font-size: 12px; font-weight: 500; white-space: nowrap; opacity: 0; visibility: hidden; transition: all 0.2s ease; pointer-events: none; z-index: 1000; margin-bottom: 10px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); } .tooltip::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border-width: 5px; border-style: solid; border-color: rgba(0,0,0,0.9) transparent transparent transparent; }
        .volume-control { display: flex; align-items: center; gap: 6px; } .volume-slider-wrapper { width: 0; opacity: 0; overflow: hidden; transition: all 0.3s ease; } .volume-control:hover .volume-slider-wrapper { width: 75px; padding: 5px; opacity: 1; } #volumeBar { width: 75px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 10px; outline: none; transform: translateY(-2px); cursor: pointer; -webkit-appearance: none; } #volumeBar::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: #fff; border-radius: 50%; cursor: pointer; }
        .time-display { font-size: 12px; color: rgba(255,255,255,0.9); font-weight: 500; min-width: 90px; text-align: center; }
        .controls-spacer { flex: 1; }
        .live-btn { display: flex; align-items: center; gap: 5px; padding: 3px 9px !important; border-radius: 4px !important; font-size: 11px !important; font-weight: 700 !important; letter-spacing: 0.05em; background: rgba(239,83,80,0.2) !important; border: 1px solid rgba(239,83,80,0.5) !important; color: #ff6b6b !important; min-width: unset !important; height: auto !important; } .live-btn.at-edge { background: rgba(239,83,80,0.25) !important; border-color: #ef5350 !important; color: #ff5252 !important; cursor: default; } .live-btn.behind-live { background: rgba(255,255,255,0.08) !important; border-color: rgba(255,255,255,0.2) !important; color: rgba(255,255,255,0.6) !important; } .live-btn.behind-live:hover { background: rgba(239,83,80,0.15) !important; border-color: rgba(239,83,80,0.4) !important; color: #ff6b6b !important; } .live-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; } .live-btn.at-edge .live-dot { animation: livePulse 1.4s ease-in-out infinite; } @keyframes livePulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.8)} }
        .settings-wrapper { position: relative; } .settings-menu { position: absolute; bottom: calc(100% + 10px); right: 0; background: rgba(15,20,30,0.98); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; padding: 8px; min-width: 170px; backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0,0,0,0.5); transform: translateY(10px); opacity: 0; pointer-events: none; transition: all 0.3s ease; z-index: 100; } .settings-menu.active { transform: translateY(0); opacity: 1; pointer-events: all; } .settings-menu-title { font-size: 11px; color: rgba(255,255,255,0.5); text-transform: uppercase; padding: 7px 10px 4px; } .settings-divider { height: 1px; background: rgba(255,255,255,0.1); margin: 4px 8px; } .settings-item { padding: 9px 11px; cursor: pointer; border-radius: 6px; transition: all 0.2s; font-size: 13px; display: flex; align-items: center; justify-content: space-between; color: rgba(255,255,255,0.9); } .settings-item:hover { background: rgba(102,126,234,0.2); } .settings-item.active { background: rgba(102,126,234,0.15); color: #667eea; }
        .settings-item.native-toggle-item { justify-content: space-between; } .native-toggle-inner { display: flex; align-items: center; gap: 8px; }
        .mini-toggle { position: relative; display: inline-block; width: 30px; height: 16px; flex-shrink: 0; } .mini-toggle input { opacity: 0; width: 0; height: 0; } .mini-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #2a2e38; transition: .3s; border-radius: 34px; } .mini-slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 2px; bottom: 2px; background: #8b98ab; transition: .3s; border-radius: 50%; } .mini-toggle input:checked + .mini-slider { background: #1976d2; } .mini-toggle input:checked + .mini-slider:before { transform: translateX(14px); background: #e1e8ed; }
        .stats-overlay { position: absolute; left: 10px; top: 10px; width: calc(100% - 20px); pointer-events: none; display: none; justify-content: space-between; align-items: flex-start; gap: 10px; z-index: 20; } .stats-overlay.active { display: flex; animation: floatIn 0.4s ease-out; } @keyframes floatIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
        .stats-panel { background: rgba(10,10,10,0.92); color: #e6eef3; padding: 10px 12px; border-radius: 8px; pointer-events: auto; font-size: 11px; line-height: 1.4; max-width: 48%; border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(10px); } .stats-panel small { color: #98a0a6; display: block; margin-bottom: 6px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; } .stats-panel small:not(:first-child) { margin-top: 8px; } .stats-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; } .stats-item { min-width: 120px; margin-bottom: 6px; } .stats-label { color: #98a0a6; font-size: 10px; margin-bottom: 2px; } .stats-value { font-weight: 600; color: #e6eef3; font-size: 12px; } .stats-bar { height: 5px; background: rgba(255,255,255,0.08); border-radius: 4px; margin-top: 5px; overflow: hidden; } .stats-bar > i { display: block; height: 100%; width: 0%; background: linear-gradient(135deg, #1976d2 0%, #1565c0 100%); transition: width 0.3s; } .small-right { text-align: right; }
        @media (max-width: 600px) { .stats-overlay { flex-direction: column; } .stats-panel { max-width: 100%; } } @media (max-width: 380px) { #backwardBtn, #forwardBtn, .volume-control, #infoBtn, .time-display { display: none; } }
    </style>
</head>
<body>
	<div class="video-wrapper" id="videoWrapper">
		<video id="video" preload="metadata" playsinline webkit-playsinline></video>
		<div class="loading-overlay" id="loadingOverlay">
			<div class="video_sspinner">
				<div>
					<div class="video_sspinner-container">
						<div class="video_sspinner-rotator">
							<div class="video_sspinner-left">
								<div class="video_sspinner-circle"></div>
							</div>
							<div class="video_sspinner-right">
								<div class="video_sspinner-circle"></div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<div class="error-message" id="error"></div>
		<div class="seek-feedback" id="seekFeedback"></div>
		<div class="stats-overlay" id="statsOverlay">
			<div class="stats-panel">
				<small>Video Info</small>
				<div class="stats-row">
					<div class="stats-item">
						<div class="stats-label">Video ID</div>
						<div class="stats-value" id="statVideoId">—</div>
					</div>
					<div class="stats-item">
						<div class="stats-label">Viewport / FPS</div>
						<div class="stats-value" id="statViewport">—</div>
					</div>
					<div class="stats-item">
						<div class="stats-label">Resolution</div>
						<div class="stats-value" id="statRes">—</div>
					</div>
					<div class="stats-item">
						<div class="stats-label">Codecs</div>
						<div class="stats-value" id="statCodecs">—</div>
					</div>
				</div>
				<small>Playback</small>
				<div class="stats-row">
					<div class="stats-item">
						<div class="stats-label">Volume</div>
						<div class="stats-value" id="statVolume">—</div>
					</div>
					<div class="stats-item">
						<div class="stats-label">Connection Speed</div>
						<div class="stats-value" id="statConn">—</div>
						<div class="stats-bar"><i id="statConnBar"></i></div>
					</div>
					<div class="stats-item">
						<div class="stats-label">Buffer Health</div>
						<div class="stats-value" id="statBuffer">—</div>
						<div class="stats-bar"><i id="statBufferBar"></i></div>
					</div>
				</div>
			</div>
			<div class="stats-panel small-right">
				<small>Diagnostics</small>
				<div class="stats-row" style="justify-content:flex-end">
					<div class="stats-item">
						<div class="stats-label">Network Activity</div>
						<div class="stats-value" id="statNet">—</div>
					</div>
					<div class="stats-item">
						<div class="stats-label">Frames Decoded</div>
						<div class="stats-value" id="statFramesDec">—</div>
					</div>
					<div class="stats-item">
						<div class="stats-label">Frames Dropped</div>
						<div class="stats-value" id="statFramesDrop">—</div>
					</div>
					<div class="stats-item">
						<div class="stats-label">Timestamp</div>
						<div class="stats-value" id="statDate">—</div>
					</div>
				</div>
			</div>
		</div>
		<div class="custom-controls" id="customControls">
			<div class="progress-container" id="progressContainer">
				<div class="progress-bar-wrapper">
					<div class="progress-buffer" id="progressBuffer"></div>
					<div class="progress-filled" id="progressFilled">
						<div class="progress-handle"></div>
					</div>
				</div>
			</div>
			<div class="controls-row">
				<button class="control-btn play-pause-btn" id="playPauseBtn">
					<i class="fas fa-play"></i>
					<span class="tooltip">Play/Pause (space)</span>
				</button>
				<button class="control-btn" id="backwardBtn">
					<i class="fas fa-backward"></i>
					<span class="tooltip">Back 10s (←)</span>
				</button>
				<button class="control-btn" id="forwardBtn">
					<i class="fas fa-forward"></i>
					<span class="tooltip">Forward 10s (→)</span>
				</button>
				<div class="volume-control">
					<button class="control-btn" id="volumeBtn">
						<i class="fas fa-volume-up"></i>
						<span class="tooltip">Volume (m)</span>
					</button>
					<div class="volume-slider-wrapper">
						<input type="range" id="volumeBar" value="25" min="0" max="100">
					</div>
				</div>
				<div class="time-display" id="timeDisplay">
					<span id="currentTime">00:00</span> / <span id="duration">00:00</span>
				</div>
				<button class="control-btn live-btn" id="liveBtn" style="display:none">
					<span class="live-dot"></span>
					<span id="liveBtnText">LIVE</span>
				</button>
				<div class="controls-spacer"></div>
				<button class="control-btn" id="infoBtn">
					<i class="fas fa-info-circle"></i>
					<span class="tooltip">Stream Info (i)</span>
				</button>
				<div class="settings-wrapper">
					<button class="control-btn" id="settingsBtn">
						<i class="fas fa-cog"></i>
						<span class="tooltip">Settings</span>
					</button>
					<div class="settings-menu" id="settingsMenu">
						<div class="settings-menu-title">Playback Speed</div>
						<div class="settings-item" data-speed="0.5"><span>0.5x</span><i class="fas fa-check" style="display:none"></i></div>
						<div class="settings-item" data-speed="0.75"><span>0.75x</span><i class="fas fa-check" style="display:none"></i></div>
						<div class="settings-item active" data-speed="1"><span>Normal</span><i class="fas fa-check"></i></div>
						<div class="settings-item" data-speed="1.25"><span>1.25x</span><i class="fas fa-check" style="display:none"></i></div>
						<div class="settings-item" data-speed="1.5"><span>1.5x</span><i class="fas fa-check" style="display:none"></i></div>
						<div class="settings-item" data-speed="2"><span>2x</span><i class="fas fa-check" style="display:none"></i></div>
					</div>
				</div>
				<button class="control-btn" id="pipBtn">
					<i class="fas fa-picture-in-picture"></i>
					<span class="tooltip">Picture-in-Picture (Ctrl+P)</span>
				</button>
				<button class="control-btn" id="fullscreenBtn">
					<i class="fas fa-expand"></i>
					<span class="tooltip">Fullscreen (f)</span>
				</button>
			</div>
		</div>
	</div>
    <script>
        function getParam(name) {
        	const urlParams = new URLSearchParams(window.location.search);
        	return urlParams.get(name);
        }

        function formatTime(t) {
        	if (isNaN(t) || !isFinite(t)) return '00:00';
        	const h = Math.floor(t / 3600);
        	const m = Math.floor((t % 3600) / 60);
        	const s = Math.floor(t % 60);
        	if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        	return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }

        const secs = v => isFinite(v) ? v.toFixed(2) + 's' : '—';

        let hls;
        let isLiveStream = false;
        let liveModeEnabled = true;
        const LIVE_EDGE_THRESHOLD = 11;
        let isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

        let lastFrameTS = null;
        let fpsEstimate = 0;

        let audioCtx, analyser, dataArray;

        let seekFeedbackTimeout;

        let video, videoWrapper, playPauseBtn, backwardBtn, forwardBtn,
        	volumeBtn, volumeBar, progressContainer, progressFilled, progressBuffer,
        	currentTimeEl, durationEl, timeDisplay, liveBtn,
        	infoBtn, settingsBtn, settingsMenu, pipBtn, fullscreenBtn,
        	seekFeedback, statsOverlay, errorEl, loadingOverlay;

        const videoSource = getParam('video_m3u8_src');
        const paramAutoplay = getParam('autoplay') === 'true';
        const paramMuted = getParam('muted') === null || getParam('muted') === 'true';
        const paramVolume = parseFloat(getParam('volume')) || 0.25;
        const paramControls = getParam('controls');
        const paramAutoskip = getParam('autoskip_to_latest') === 'true';
        const paramAutoskipInt = parseInt(getParam('autoskip_interval')) || 0;
        const paramEnableNative = getParam('enableNative') === 'true';
        const paramStartSkipToCurrent = getParam('startSkipToCurrent') === 'true';

        function showError(msg) {
        	if (!errorEl) return;
        	errorEl.innerHTML = msg;
        	errorEl.classList.add('show');
        	setTimeout(() => errorEl.classList.remove('show'), 5000);
        }

        function showLoading(show) {
        	if (!loadingOverlay) return;
        	show ? loadingOverlay.classList.add('active') : loadingOverlay.classList.remove('active');
        }

        function setupAutoSkip(intervalSecs) {
        	if (!intervalSecs || intervalSecs <= 0) return;
        	setInterval(() => {
        		if (video && video.duration && isFinite(video.duration)) {
        			video.currentTime = Math.max(0, video.duration - 5);
        		}
        	}, intervalSecs * 1000);
        }

        function showSeekFeedback(seconds) {
        	clearTimeout(seekFeedbackTimeout);
        	const fwd = seconds > 0;
        	const iconSvg = `
                <svg fill="#fff" width="60" height="60" viewBox="0 0 66 32" style="transform:${fwd ? 'scaleX(-1)' : 'none'}">
                    <path class="skparr1" d="M18 4L6 16L18 28" stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="none"/>
                    <path class="skparr2" d="M40 4L28 16L40 28" stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="none"/>
                    <path class="skparr3" d="M62 4L50 16L62 28" stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="none"/>
                </svg>
                <div class="seek-text"><span>${fwd ? '+10' : '-10'}</span></div>`;
        	seekFeedback.innerHTML = iconSvg;
        	seekFeedback.className = 'seek-feedback show ' + (fwd ? 'forward' : 'backward');
        	seekFeedbackTimeout = setTimeout(() => seekFeedback.classList.remove('show'), 600);
        }

        function showVolumeFeedback(delta) {
        	clearTimeout(seekFeedbackTimeout);
        	const cur = Math.round((video.muted ? 0 : video.volume) * 100);
        	seekFeedback.innerHTML = `<div class="volume-text"><span>${cur}%</span></div>`;
        	seekFeedback.className = 'seek-feedback show volume-feedback';
        	seekFeedbackTimeout = setTimeout(() => seekFeedback.classList.remove('show'), 600);
        }

        function updateVolumeIcon() {
        	if (!volumeBtn || !video) return;
        	const icon = volumeBtn.querySelector('i');
        	const vol = video.muted ? 0 : video.volume * 100;
        	if (vol === 0 || video.muted) icon.className = 'fas fa-volume-mute';
        	else if (vol < 50) icon.className = 'fas fa-volume-down';
        	else icon.className = 'fas fa-volume-up';
        }

        function isPiPSupported() {
        	return document.pictureInPictureEnabled && !video.disablePictureInPicture && video.requestPictureInPicture;
        }

        function updatePipButton() {
        	if (!pipBtn || !isPiPSupported()) {
        		if (pipBtn) pipBtn.style.display = 'none';
        		return;
        	}
        	const icon = pipBtn.querySelector('i');
        	icon.className = document.pictureInPictureElement === video ? 'fas fa-times-circle' : 'fas fa-picture-in-picture';
        }
        async function togglePiP() {
        	if (!isPiPSupported()) return;
        	try {
        		document.pictureInPictureElement === video ?
        			await document.exitPictureInPicture() :
        			await video.requestPictureInPicture();
        		updatePipButton();
        	} catch (e) {
        		console.error('PiP:', e);
        	}
        }

        function isFullscreen() {
        	return !!(document.fullscreenElement || document.webkitFullscreenElement ||
        		document.mozFullScreenElement || document.msFullscreenElement ||
        		(isIOS && videoWrapper.classList.contains('fs')));
        }

        function updateFullscreenIcon() {
        	if (!fullscreenBtn) return;
        	const icon = fullscreenBtn.querySelector('i');
        	icon.className = isFullscreen() ? 'fas fa-compress' : 'fas fa-expand';
        }

        function toggleFullscreen() {
        	if (!videoWrapper) return;
        	if (isIOS) {
        		video.webkitEnterFullscreen && video.webkitEnterFullscreen();
        		return;
        	}
        	if (!isFullscreen()) {
        		videoWrapper.classList.add('fs');
        		(videoWrapper.requestFullscreen || videoWrapper.webkitRequestFullscreen ||
        			videoWrapper.mozRequestFullScreen || videoWrapper.msRequestFullscreen).call(videoWrapper);
        	} else {
        		videoWrapper.classList.remove('fs');
        		(document.exitFullscreen || document.webkitExitFullscreen ||
        			document.mozCancelFullScreen || document.msExitFullscreen).call(document);
        	}
        }

        function injectNativeControlsToggle() {
        	const divider = document.createElement('div');
        	divider.className = 'settings-divider';

        	const item = document.createElement('div');
        	item.className = 'settings-item native-toggle-item';
        	item.innerHTML = `
                <div class="native-toggle-inner">
                    <i class="fas fa-sliders-h" style="font-size:13px;color:rgba(255,255,255,0.6)"></i>
                    <span>Native Controls</span>
                </div>
                <label class="mini-toggle">
                    <input type="checkbox" id="nativeControlsToggle">
                    <span class="mini-slider"></span>
                </label>`;

        	settingsMenu.appendChild(divider);
        	settingsMenu.appendChild(item);

        	item.addEventListener('click', e => e.stopPropagation());

        	document.getElementById('nativeControlsToggle').addEventListener('change', function() {
        		if (this.checked) {
        			videoWrapper.classList.add('default-controls');
        			video.setAttribute('controls', 'true');
        		} else {
        			videoWrapper.classList.remove('default-controls');
        			video.removeAttribute('controls');
        		}
        	});
        }

        function isAtLiveEdge() {
        	if (!isLiveStream || !video.seekable || video.seekable.length === 0) return false;
        	return video.currentTime >= video.seekable.end(video.seekable.length - 1) - LIVE_EDGE_THRESHOLD;
        }

        function goToLiveEdge() {
        	if (!video.seekable || video.seekable.length === 0) return;
        	video.currentTime = Math.max(0, video.seekable.end(video.seekable.length - 1) - 5);
        	if (video.paused) video.play().catch(() => {});
        }

        function updateLiveUI() {
        	if (!liveBtn) return;
        	if (!isLiveStream) {
        		liveBtn.style.display = 'none';
        		if (timeDisplay) timeDisplay.style.display = '';
        		return;
        	}
        	liveBtn.style.display = 'flex';
        	const atEdge = isAtLiveEdge();
        	if (atEdge && !video.paused) {
        		liveBtn.classList.add('at-edge');
        		liveBtn.classList.remove('behind-live');
        		if (timeDisplay) timeDisplay.style.display = 'none';
        	} else {
        		liveBtn.classList.remove('at-edge');
        		liveBtn.classList.add('behind-live');
        		if (timeDisplay) timeDisplay.style.display = '';
        		if (video.seekable && video.seekable.length > 0) {
        			const behind = Math.max(0, video.seekable.end(video.seekable.length - 1) - video.currentTime);
        			if (currentTimeEl) currentTimeEl.textContent = '-' + formatTime(behind);
        			if (durationEl) durationEl.textContent = 'LIVE';
        		}
        	}
        }

        function updateProgress() {
        	if (!video) return;
        	const seekLen = video.seekable ? video.seekable.length : 0;

        	if (isLiveStream) {
        		if (isAtLiveEdge()) {
        			if (progressFilled) progressFilled.style.width = '100%';
        			if (progressBuffer) progressBuffer.style.width = '100%';
        		} else if (seekLen > 0) {
        			const start = video.seekable.start(0);
        			const end = video.seekable.end(seekLen - 1);
        			const pct = ((video.currentTime - start) / ((end - start) || 1)) * 100;
        			if (progressFilled) progressFilled.style.width = Math.max(0, Math.min(100, pct)) + '%';
        			if (progressBuffer) progressBuffer.style.width = '100%';
        		}
        		updateLiveUI();
        		return;
        	}

        	if (currentTimeEl) currentTimeEl.textContent = formatTime(video.currentTime);
        	if (durationEl) {
        		durationEl.textContent = isFinite(video.duration) ? formatTime(video.duration) :
        			(seekLen > 0 ? 'Live' : '—');
        	}

        	if (isFinite(video.duration) && video.duration > 0) {
        		const filled = (video.currentTime / video.duration) * 100;
        		if (progressFilled) progressFilled.style.width = Math.max(0, Math.min(100, filled)) + '%';

        		let bufPct = filled;
        		if (video.buffered && video.buffered.length > 0) {
        			let be = video.buffered.end(video.buffered.length - 1);
        			if (be < video.currentTime) be = video.currentTime;
        			bufPct = (be / video.duration) * 100;
        			if (video.duration - be <= 0.5) bufPct = 100;
        		}
        		bufPct = Math.max(bufPct, filled);
        		if (progressBuffer) progressBuffer.style.width = Math.max(0, Math.min(100, bufPct)) + '%';
        	} else if (seekLen > 0) {
        		const start = video.seekable.start(0);
        		const end = video.seekable.end(seekLen - 1);
        		const pct = ((video.currentTime - start) / ((end - start) || 1)) * 100;
        		if (progressFilled) progressFilled.style.width = Math.max(0, Math.min(100, pct)) + '%';
        		if (progressBuffer) progressBuffer.style.width = '100%';
        	} else {
        		if (progressFilled) progressFilled.style.width = '0%';
        		if (progressBuffer) progressBuffer.style.width = '0%';
        	}
        }

        function getBufferHealth() {
        	try {
        		const b = video.buffered;
        		if (!b || b.length === 0) return 0;
        		for (let i = 0; i < b.length; i++) {
        			if (video.currentTime >= b.start(i) && video.currentTime <= b.end(i)) {
        				return b.end(i) - video.currentTime;
        			}
        		}
        		return b.end(b.length - 1) - video.currentTime;
        	} catch (e) {
        		return 0;
        	}
        }

        function detectCodec() {
        	if (hls && hls.levels && hls.levels.length > 0) {
        		const l = hls.levels[hls.currentLevel];
        		if (l && l.videoCodec) return l.videoCodec + (l.audioCodec ? ' / ' + l.audioCodec : '');
        	}
        	return 'HLS Stream';
        }

        function onVideoFrame(now) {
        	if (lastFrameTS !== null) {
        		const d = (now - lastFrameTS) / 1000;
        		if (d > 0) fpsEstimate = 1 / d;
        	}
        	lastFrameTS = now;
        	if (video && video.requestVideoFrameCallback) video.requestVideoFrameCallback(onVideoFrame);
        }

        function startStatsUpdate() {
        	setInterval(() => {
        		if (!statsOverlay || !statsOverlay.classList.contains('active')) return;
        		try {
        			document.getElementById('statDate').textContent = new Date().toLocaleString();
        			document.getElementById('statViewport').textContent =
        				`${video.clientWidth}×${video.clientHeight} / ${fpsEstimate ? Math.round(fpsEstimate) + ' fps' : '—'}`;
        			document.getElementById('statRes').textContent =
        				`${video.videoWidth || '—'}×${video.videoHeight || '—'}`;
        			document.getElementById('statCodecs').textContent = detectCodec();
        			document.getElementById('statVolume').textContent =
        				`${Math.round((video.muted ? 0 : video.volume) * 100)}% / ${video.muted ? 'muted' : 'unmuted'}`;

        			if (hls && hls.bandwidthEstimate) {
        				const kbps = hls.bandwidthEstimate / 1024;
        				document.getElementById('statConn').textContent = kbps.toFixed(0) + ' kB/s';
        				document.getElementById('statConnBar').style.width = Math.min(100, Math.round(kbps / 2000 * 100)) + '%';
        			} else {
        				document.getElementById('statConn').textContent = '—';
        				document.getElementById('statConnBar').style.width = '0%';
        			}

        			const buf = getBufferHealth();
        			document.getElementById('statBuffer').textContent = secs(buf);
        			document.getElementById('statBufferBar').style.width = Math.min(100, Math.round(buf / 30 * 100)) + '%';

        			if (hls && hls.levels && hls.levels.length > 0) {
        				const l = hls.levels[hls.currentLevel];
        				document.getElementById('statNet').textContent = l ? Math.round(l.bitrate / 1024) + ' kbps' : '—';
        			} else {
        				document.getElementById('statNet').textContent = '—';
        			}

        			if (video.getVideoPlaybackQuality) {
        				const q = video.getVideoPlaybackQuality();
        				document.getElementById('statFramesDec').textContent = q.totalVideoFrames ?? '—';
        				document.getElementById('statFramesDrop').textContent = q.droppedVideoFrames ?? '—';
        			}

        			if (videoSource) {
        				document.getElementById('statVideoId').textContent =
        					videoSource.split('/').pop().split('?')[0] || 'Stream';
        			}
        		} catch (e) {}
        	}, 333);
        }

        function loadStream() {
        	if (!videoSource) {
        		showError('No M3U8 URL provided. Use ?video_m3u8_src=URL');
        		return;
        	}

        	showLoading(true);
        	if (hls) {
        		hls.destroy();
        		hls = null;
        	}

        	if (Hls.isSupported()) {
        		hls = new Hls({
        			enableWorker: true,
        			lowLatencyMode: true,
        			backBufferLength: 600
        		});
        		hls.loadSource(videoSource);
        		hls.attachMedia(video);

        		hls.on(Hls.Events.MANIFEST_PARSED, () => {
        			showLoading(false);
        			applyParamSettings();
        			if (paramAutoskip && paramAutoskipInterval > 0) setupAutoSkip(paramAutoskipInt);
        			if (paramAutoplay) video.play().catch(e => console.log('Autoplay blocked:', e));
        			if (paramStartSkipToCurrent) setTimeout(() => goToLiveEdge(), 500);
        		});

        		hls.on(Hls.Events.LEVEL_LOADED, (e, data) => {
        			const wasLive = isLiveStream;
        			isLiveStream = data.details.live;
        			if (isLiveStream !== wasLive) updateLiveUI();
        		});

        		hls.on(Hls.Events.ERROR, (e, data) => {
        			if (!data.fatal) return;
        			showLoading(false);
        			if (data.type === Hls.ErrorTypes.NETWORK_ERROR) showError('Network error loading stream');
        			else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
        				showError('Media error – recovering…');
        				hls.recoverMediaError();
        			} else showError('Fatal error loading stream');
        		});

        	} else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        		video.src = videoSource;
        		video.addEventListener('loadedmetadata', () => {
        			showLoading(false);
        			applyParamSettings();
        			if (paramAutoskip && paramAutoskipInt > 0) setupAutoSkip(paramAutoskipInt);
        			if (paramAutoplay) video.play().catch(e => console.log('Autoplay blocked:', e));
        			if (paramStartSkipToCurrent) setTimeout(() => goToLiveEdge(), 500);
        		}, {
        			once: true
        		});
        		video.addEventListener('error', () => {
        			showError('Error loading stream');
        			showLoading(false);
        		}, {
        			once: true
        		});
        	} else {
        		showError('Your browser does not support HLS');
        		showLoading(false);
        	}
        }

        function applyParamSettings() {
        	video.muted = paramMuted;
        	video.volume = paramMuted ? 0 : paramVolume;
        	if (volumeBar) volumeBar.value = video.volume * 100;
        	updateVolumeIcon();

        	if (paramControls === 'true') {
        		video.controls = true;
        		videoWrapper.classList.add('default-controls');
        	} else if (paramControls === 'false') {
        		video.controls = false;
        		videoWrapper.classList.remove('default-controls');
        	}
        }

        window.addEventListener('DOMContentLoaded', () => {
        	video = document.getElementById('video');
        	videoWrapper = document.getElementById('videoWrapper');
        	playPauseBtn = document.getElementById('playPauseBtn');
        	backwardBtn = document.getElementById('backwardBtn');
        	forwardBtn = document.getElementById('forwardBtn');
        	volumeBtn = document.getElementById('volumeBtn');
        	volumeBar = document.getElementById('volumeBar');
        	progressContainer = document.getElementById('progressContainer');
        	progressFilled = document.getElementById('progressFilled');
        	progressBuffer = document.getElementById('progressBuffer');
        	currentTimeEl = document.getElementById('currentTime');
        	durationEl = document.getElementById('duration');
        	timeDisplay = document.getElementById('timeDisplay');
        	liveBtn = document.getElementById('liveBtn');
        	infoBtn = document.getElementById('infoBtn');
        	settingsBtn = document.getElementById('settingsBtn');
        	settingsMenu = document.getElementById('settingsMenu');
        	pipBtn = document.getElementById('pipBtn');
        	fullscreenBtn = document.getElementById('fullscreenBtn');
        	seekFeedback = document.getElementById('seekFeedback');
        	statsOverlay = document.getElementById('statsOverlay');
        	errorEl = document.getElementById('error');
        	loadingOverlay = document.getElementById('loadingOverlay');

        	if (paramEnableNative) injectNativeControlsToggle();

        	video.addEventListener('play', () => {
        		if (playPauseBtn) playPauseBtn.innerHTML = '<i class="fas fa-pause"></i><span class="tooltip">Pause (space)</span>';
        		videoWrapper.classList.add('playing');
        		if (isLiveStream) updateLiveUI();
        	});
        	video.addEventListener('pause', () => {
        		if (playPauseBtn) playPauseBtn.innerHTML = '<i class="fas fa-play"></i><span class="tooltip">Play (space)</span>';
        		videoWrapper.classList.remove('playing');
        		if (isLiveStream) updateLiveUI();
        	});
        	video.addEventListener('timeupdate', updateProgress);
        	video.addEventListener('waiting', () => showLoading(true));
        	video.addEventListener('playing', () => showLoading(false));
        	video.addEventListener('enterpictureinpicture', updatePipButton);
        	video.addEventListener('leavepictureinpicture', updatePipButton);
        	if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(onVideoFrame);

        	if (isIOS) {
        		video.addEventListener('webkitbeginfullscreen', () => {
        			videoWrapper.classList.add('fs');
        			updateFullscreenIcon();
        		});
        		video.addEventListener('webkitendfullscreen', () => {
        			videoWrapper.classList.remove('fs');
        			updateFullscreenIcon();
        		});
        	}

        	playPauseBtn.addEventListener('click', () => video.paused ? video.play() : video.pause());

        	backwardBtn.addEventListener('click', () => {
        		const min = isLiveStream && video.seekable.length ? video.seekable.start(0) : 0;
        		video.currentTime = Math.max(min, video.currentTime - 10);
        		showSeekFeedback(-10);
        	});

        	forwardBtn.addEventListener('click', () => {
        		const max = isLiveStream && video.seekable.length ?
        			video.seekable.end(video.seekable.length - 1) : video.duration;
        		video.currentTime = Math.min(isFinite(max) ? max : video.currentTime, video.currentTime + 10);
        		showSeekFeedback(+10);
        	});

        	volumeBtn.addEventListener('click', () => {
        		video.muted = !video.muted;
        		updateVolumeIcon();
        	});

        	volumeBar.addEventListener('input', e => {
        		video.volume = e.target.value / 100;
        		video.muted = (video.volume === 0);
        		updateVolumeIcon();
        		showVolumeFeedback(0);
        	});

        	progressContainer.addEventListener('click', e => {
        		const rect = progressContainer.getBoundingClientRect();
        		const pct = (e.clientX - rect.left) / rect.width;
        		if (isLiveStream && video.seekable.length) {
        			const s = video.seekable.start(0),
        				end = video.seekable.end(video.seekable.length - 1);
        			video.currentTime = s + Math.max(0, Math.min(1, pct)) * (end - s);
        		} else if (isFinite(video.duration)) {
        			video.currentTime = Math.max(0, Math.min(video.duration, pct * video.duration));
        		}
        	});

        	liveBtn.addEventListener('click', goToLiveEdge);

        	infoBtn.addEventListener('click', () => statsOverlay.classList.toggle('active'));

        	settingsBtn.addEventListener('click', e => {
        		e.stopPropagation();
        		settingsMenu.classList.toggle('active');
        	});

        	document.querySelectorAll('.settings-item[data-speed]').forEach(item => {
        		item.addEventListener('click', () => {
        			video.playbackRate = parseFloat(item.dataset.speed);
        			document.querySelectorAll('.settings-item[data-speed]').forEach(i => {
        				i.classList.remove('active');
        				i.querySelector('i').style.display = 'none';
        			});
        			item.classList.add('active');
        			item.querySelector('i').style.display = 'block';
        			settingsMenu.classList.remove('active');
        		});
        	});

        	document.addEventListener('click', e => {
        		if (!e.target.closest('.settings-wrapper')) settingsMenu.classList.remove('active');
        	});

        	pipBtn.addEventListener('click', togglePiP);
        	fullscreenBtn.addEventListener('click', toggleFullscreen);

        	document.addEventListener('fullscreenchange', updateFullscreenIcon);
        	document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);

        	let hideTimer;
        	videoWrapper.addEventListener('mousemove', () => {
        		videoWrapper.classList.remove('controls-hidden');
        		clearTimeout(hideTimer);
        		if (!video.paused) hideTimer = setTimeout(() => videoWrapper.classList.add('controls-hidden'), 3000);
        	});
        	videoWrapper.addEventListener('mouseleave', () => {
        		clearTimeout(hideTimer);
        		videoWrapper.classList.add('controls-hidden');
        	});
        	videoWrapper.setAttribute('tabindex', '0');

        	document.addEventListener('keydown', e => {
        		if (!video || e.target.tagName === 'INPUT') return;
        		switch (e.code) {
        			case 'Space':
        				e.preventDefault();
        				video.paused ? video.play() : video.pause();
        				break;
        			case 'ArrowLeft':
        				e.preventDefault();
        				backwardBtn.click();
        				break;
        			case 'ArrowRight':
        				e.preventDefault();
        				forwardBtn.click();
        				break;
        			case 'ArrowUp':
        				e.preventDefault();
        				video.volume = Math.min(1, video.volume + 0.05);
        				if (volumeBar) volumeBar.value = video.volume * 100;
        				updateVolumeIcon();
        				showVolumeFeedback(0.05);
        				break;
        			case 'ArrowDown':
        				e.preventDefault();
        				video.volume = Math.max(0, video.volume - 0.05);
        				if (volumeBar) volumeBar.value = video.volume * 100;
        				updateVolumeIcon();
        				showVolumeFeedback(-0.05);
        				break;
        			case 'KeyF':
        				e.preventDefault();
        				toggleFullscreen();
        				break;
        			case 'KeyM':
        				e.preventDefault();
        				volumeBtn.click();
        				break;
        			case 'KeyI':
        				e.preventDefault();
        				infoBtn.click();
        				break;
        			case 'KeyP':
        				if (e.ctrlKey || e.metaKey) {
        					e.preventDefault();
        					togglePiP();
        				}
        				break;
        		}
        	});

        	updateVolumeIcon();
        	updatePipButton();
        	updateFullscreenIcon();
        	setInterval(updateFullscreenIcon, 1000);
        	setInterval(() => updatePipButton(), 1000);
        	startStatsUpdate();

        	loadStream();
        });
    </script>
</body>
</html>
